name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpng-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  vita:
    name: PS Vita build
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vita build
        run: cmake -S . -B build-vita -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
      - name: Build Vita VPK
        run: cmake --build build-vita --parallel
      - name: Verify VPK
        run: test -s build-vita/FTL-for-VITA.vpk
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: FTL-for-VITA-vpk
          path: build-vita/FTL-for-VITA.vpk
