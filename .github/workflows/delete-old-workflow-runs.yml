name: Delete old workflow runs

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: "Keep this many newest completed runs per workflow"
        required: true
        default: "30"
        type: string
      target_workflow:
        description: "Workflow file name to target (blank = all workflows)"
        required: false
        default: ""
        type: string
  schedule:
    # Weekly at 03:00 JST on Monday (GitHub cron uses UTC).
    - cron: "0 18 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LATEST: ${{ inputs.keep_latest || '30' }}
          TARGET_WORKFLOW: ${{ inputs.target_workflow }}
          REPO: ${{ github.repository }}
        run: bash scripts/cleanup-old-workflow-runs.sh
